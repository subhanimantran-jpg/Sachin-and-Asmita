<!DOCTYPE html>
<html lang="mr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>शुभ निमंत्रण</title>


    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Serif+Devanagari:wght@400;500;600;700&family=Tiro+Devanagari+Marathi&display=swap"
        rel="stylesheet"
    >


    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- OPENING SCREEN -->

    <section
        id="openingScreen"
        class="opening-screen"
    >

        <div class="opening-overlay"></div>


        <div class="opening-content">


            <!-- LOGO -->

            <img
                src="assets/images/logo.png"
                alt="Logo"
                class="opening-logo"
            >


            <p class="ganesh-mantra">

                ॥ श्री गणेशाय नमः ॥

            </p>


            <h1
                id="openingNames"
                class="opening-names"
            ></h1>


            <p
                id="openingEvent"
                class="opening-event"
            ></p>


            <p
                id="openingDate"
                class="opening-date"
            ></p>


            <button
                id="openInvitationBtn"
                class="open-button"
                type="button"
            >

                निमंत्रण उघडा

            </button>


        </div>

    </section>



    <!-- MAIN WEBSITE -->

    <main
        id="mainWebsite"
        class="main-website"
    >


        <!-- MUSIC BUTTON -->

        <button
            id="musicBtn"
            class="music-btn"
            type="button"
        >

            ♫

        </button>



        <!-- HERO -->

        <section class="hero-section">


            <div class="hero-overlay"></div>


            <div class="hero-content">


                <img
                    src="assets/images/logo.png"
                    alt="Logo"
                    class="hero-logo"
                >


                <p class="hero-ganesh">

                    ॥ श्री गणेशाय नमः ॥

                </p>


                <p class="hero-subtitle">

                    शुभ मंगल सावधान

                </p>


                <h1
                    id="coupleNames"
                    class="couple-names"
                ></h1>


                <div class="gold-line">

                    ✦

                </div>


                <p
                    id="heroEvent"
                    class="hero-event"
                ></p>


                <p
                    id="heroDate"
                    class="hero-date"
                ></p>



                <!-- VIDEO -->

                <div
                    id="videoContainer"
                    class="video-container"
                >

                    व्हिडिओ लोड होत आहे...

                </div>


                <p class="scroll-text">

                    खाली स्क्रोल करा ↓

                </p>


            </div>

        </section>



        <!-- PRE WEDDING -->

        <section class="pre-wedding-section">


            <div class="section-heading">

                <span></span>

                <h2
                    id="preWeddingEvent"
                ></h2>

                <span></span>

            </div>


            <div class="pre-wedding-card">


                <p
                    id="preWeddingDate"
                ></p>


                <p
                    id="preWeddingTime"
                ></p>


                <p
                    id="preWeddingVenue"
                ></p>


            </div>


        </section>



        <!-- WEDDING DETAILS -->

        <section class="details-section">


            <div class="section-heading">

                <span></span>

                <h2>

                    विवाह सोहळा

                </h2>

                <span></span>

            </div>


            <div class="details-wrapper">


                <div class="detail-card">

                    <p class="detail-label">

                        दिनांक

                    </p>


                    <h3
                        id="weddingDate"
                    ></h3>


                    <p
                        id="weddingDay"
                    ></p>


                </div>



                <div class="detail-card">

                    <p class="detail-label">

                        वेळ

                    </p>


                    <h3
                        id="weddingTime"
                    ></h3>


                </div>



                <div class="detail-card venue-card">

                    <p class="detail-label">

                        विवाहस्थळ

                    </p>


                    <h3
                        id="venueName"
                    ></h3>


                    <p
                        id="venueAddress"
                    ></p>


                    <a
                        id="mapButton"
                        class="map-button"
                        target="_blank"
                        rel="noopener"
                    >

                        स्थळ पहा

                    </a>


                </div>


            </div>


        </section>



        <!-- FAMILY -->

        <section class="family-section">


            <div class="section-heading">

                <span></span>

                <h2>

                    परिवार

                </h2>

                <span></span>

            </div>


            <div class="family-wrapper">


                <div class="family-card">


                    <h3>

                        वर पक्ष

                    </h3>


                    <div
                        id="groomFamily"
                    ></div>


                </div>



                <div class="family-card">


                    <h3>

                        वधू पक्ष

                    </h3>


                    <div
                        id="brideFamily"
                    ></div>


                </div>


            </div>


        </section>



        <!-- INVITERS -->

        <section class="inviter-section">


            <div class="section-heading light-heading">

                <span></span>

                <h2>

                    निमंत्रक

                </h2>

                <span></span>

            </div>


            <div
                id="invitersList"
                class="inviters-list"
            ></div>


        </section>



        <!-- FOOTER -->

        <footer>


            <img
                src="assets/images/logo.png"
                alt="Logo"
                class="footer-logo"
            >


            <p>

                आपल्या उपस्थितीने हा मंगल सोहळा
                अधिक आनंदमय करावा,
                ही नम्र विनंती.

            </p>


            <a
                id="instagramLink"
                class="instagram-link"
                href="#"
                target="_blank"
                rel="noopener"
            >

                Instagram

            </a>


        </footer>


    </main>



    <!-- BACKGROUND MUSIC -->

    <audio
        id="backgroundMusic"
        loop
        preload="auto"
    ></audio>


    <script src="data.js"></script>

    <script src="script.js"></script>


</body>

</html>
